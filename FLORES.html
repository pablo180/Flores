<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>FLORES</title>
    <style>
        #fireworks-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        /* Posicionamiento y animación para las 3 flores adicionales (4, 5 y 6) */
        .flower--4 {
            left: -25vmin;
            transform: rotate(-15deg) scale(0.85);
            animation: moving-flower-1 4.2s linear infinite;
        }
        .flower--4 .flower__line {
            height: 48vmin;
            animation-delay: 0.6s;
        }

        .flower--5 {
            left: 28vmin;
            transform: rotate(12deg) scale(0.9);
            animation: moving-flower-2 3.8s linear infinite;
        }
        .flower--5 .flower__line {
            height: 52vmin;
            animation-delay: 0.9s;
        }

        .flower--6 {
            left: -12vmin;
            transform: rotate(-8deg) scale(0.75);
            animation: moving-flower-3 4.5s linear infinite;
        }
        .flower--6 .flower__line {
            height: 42vmin;
            animation-delay: 1.2s;
        }
    </style>
</head>

    <canvas id="fireworks-canvas"></canvas>

    <div class="night"></div>

      <div class="flower flower--1">
